# 1. INPUT: read container logs from node
<source>
  @type tail
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag kubernetes.*
  format json
</source>

# 3. OUTPUT: send to Elasticsearch
<match kubernetes.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  index_name kubernetes-logs
</match>