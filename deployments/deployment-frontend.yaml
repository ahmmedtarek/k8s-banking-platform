apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: banking
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: frontend
  selector:
    app: frontend-deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-deployment
  name: frontend-deployment
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-deployment
  strategy: 
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend-deployment
    spec:
      containers:
      - image: frontend:latest
        imagePullPolicy: Never
        name: frontend
        ports:
        - containerPort: 80
        resources: 
          limits:
            memory: "500Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
