apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: fluentd-daemonset
  namespace: banking

spec:
  selector:
    matchLabels:
      app: fluentd

  template:
    metadata:
      labels:
        app: fluentd

    spec:
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1-debian-elasticsearch
          resources:
            limits:
              memory: "200Mi"
              cpu: "200m"
            requests:
              memory: "100Mi"
              cpu: "100m"
          volumeMounts:
            - name: varlog
              mountPath: /var/log

            - name: config-volume
              mountPath: /fluentd/etc/

            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: config-volume
          configMap:
            name: fluentd-config

        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers